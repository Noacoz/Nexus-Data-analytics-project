<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Analytics - Transform Your Data Into Insights — Instantly</title>
    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: {
                            950: '#020617',
                            900: '#0f172a',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            color: #f8fafc;
            overflow-x: hidden;
        }
        .glass {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glow-bg {
            background: radial-gradient(ellipse at center, rgba(99, 102, 241, 0.15) 0%, rgba(15, 23, 42, 0) 70%);
        }
        .gradient-text {
            background: linear-gradient(135deg, #60a5fa 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .brand-gradient {
            background: linear-gradient(135deg, #6366f1 0%, #06b6d4 100%);
        }
        .brand-gradient-text {
            background: linear-gradient(135deg, #6366f1 0%, #06b6d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .spotlight {
            position: relative;
            overflow: hidden;
        }
        .spotlight::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(99, 102, 241, 0.1) 0%, transparent 50%);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .spotlight:hover::before {
            opacity: 1;
        }
        
        /* Aurora Background Animation */
        .aurora-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -10;
            pointer-events: none;
        }
        .aurora-circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            animation: aurora-drift 20s infinite linear;
        }
        @keyframes aurora-drift {
            0% {
                transform: translate(0, 0) rotate(0deg) scale(1);
            }
            25% {
                transform: translate(5%, 10%) rotate(90deg) scale(1.1);
            }
            50% {
                transform: translate(10%, 5%) rotate(180deg) scale(1.2);
            }
            75% {
                transform: translate(5%, -5%) rotate(270deg) scale(1.1);
            }
            100% {
                transform: translate(0, 0) rotate(360deg) scale(1);
            }
        }
        
        /* Film Grain Overlay */
        .film-grain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='1' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.03;
            mix-blend-mode: overlay;
            pointer-events: none;
            z-index: 100;
        }
        
        /* 3D Tilt Effect */
        .tilt-card {
            transition: transform 0.1s ease-out;
            transform-style: preserve-3d;
        }
        
        /* Cinematic Text Reveal */
        .text-reveal-container {
            overflow: hidden;
            display: inline-block;
        }
        .text-reveal-word {
            display: inline-block;
            transform: translateY(100%);
            animation: text-reveal-up 0.8s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }
        @keyframes text-reveal-up {
            to {
                transform: translateY(0%);
            }
        }
        
        /* Typewriter Effect */
        .typewriter {
            overflow: hidden;
            border-right: 2px solid #60a5fa;
            white-space: nowrap;
            animation: typing 3.5s steps(40, end), blink-caret 0.75s step-end infinite;
        }
        
        @keyframes typing {
            from { width: 0 }
            to { width: 100% }
        }
        
        @keyframes blink-caret {
            from, to { border-color: transparent }
            50% { border-color: #60a5fa }
        }
        
        /* Parallax Effect */
        .parallax-element {
            will-change: transform;
        }
        
        /* Scroll Reveal Animations */
        .fade-in-up {
            animation: fadeInUp 0.6s ease-out forwards;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .slide-in-left {
            animation: slideInLeft 0.6s ease-out forwards;
        }
        
        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .scale-in {
            animation: scaleIn 0.5s ease-out forwards;
        }
        
        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        .bounce-in {
            animation: bounceIn 0.8s ease-out forwards;
        }
        
        @keyframes bounceIn {
            0% {
                opacity: 0;
                transform: scale(0.3);
            }
            50% {
                opacity: 1;
                transform: scale(1.05);
            }
            70% {
                transform: scale(0.9);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        .stagger-item {
            opacity: 0;
        }
        
        .parallax-bg {
            transform: translateY(calc(var(--scroll-y) * -0.5px));
        }

        /* Loading Spinner */
        .spinner {
            border: 2px solid #f3f4f6;
            border-top: 2px solid #3b82f6;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            max-width: 400px;
        }
        .toast {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            animation: slideInRight 0.3s ease-out;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .toast.success {
            border-left: 4px solid #10b981;
        }
        .toast.error {
            border-left: 4px solid #ef4444;
        }
        .toast.info {
            border-left: 4px solid #3b82f6;
        }
        .toast.warning {
            border-left: 4px solid #f59e0b;
        }
        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        .toast-exit {
            animation: slideOutRight 0.3s ease-in forwards;
        }
        @keyframes slideOutRight {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(100%);
                opacity: 0;
            }
        }

        /* Loading Overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 6, 23, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.3s ease;
        }
        .loading-overlay.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        /* Chart Placeholders */
        .chart-placeholder {
            background: linear-gradient(45deg, #1e293b 25%, #334155 25%, #334155 50%, #1e293b 50%, #1e293b 75%, #334155 75%);
            background-size: 20px 20px;
            animation: chartShimmer 2s linear infinite;
        }
        @keyframes chartShimmer {
            0% { background-position: 0 0; }
            100% { background-position: 20px 20px; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        // Toast Notification System
        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 4000);
                return () => clearTimeout(timer);
            }, [onClose]);
            
            return React.createElement('div', {
                className: `toast ${type}`
            },
                React.createElement('div', { 
                    className: `w-3 h-3 rounded-full ${
                        type === 'success' ? 'bg-green-500' :
                        type === 'error' ? 'bg-red-500' :
                        type === 'warning' ? 'bg-yellow-500' : 'bg-blue-500'
                    }`
                }),
                React.createElement('div', { className: 'flex-1' },
                    React.createElement('p', { className: 'text-white font-medium' }, message)
                ),
                React.createElement('button', {
                    onClick: onClose,
                    className: 'text-slate-400 hover:text-white transition-colors'
                }, '✕')
            );
        };

        const ToastContainer = ({ toasts, removeToast }) => {
            return React.createElement('div', { className: 'toast-container' },
                toasts.map(toast => 
                    React.createElement(Toast, {
                        key: toast.id,
                        message: toast.message,
                        type: toast.type,
                        onClose: () => removeToast(toast.id)
                    })
                )
            );
        };

        // Loading Overlay Component
        const LoadingOverlay = ({ isVisible }) => {
            return React.createElement('div', {
                className: `loading-overlay ${!isVisible ? 'fade-out' : ''}`
            },
                React.createElement('div', { className: 'text-center' },
                    React.createElement('div', { 
                        className: 'w-16 h-16 rounded-full bg-gradient-to-r from-indigo-500 to-cyan-400 flex items-center justify-center mx-auto mb-4 animate-spin'
                    },
                        React.createElement('div', { 
                            className: 'w-12 h-12 rounded-full bg-slate-950'
                        })
                    ),
                    React.createElement('p', { className: 'text-slate-300' }, 'Loading...')
                )
            );
        };
        
        // Aurora Background Component
        const AuroraBackground = () => {
            return React.createElement('div', { className: 'aurora-bg' },
                React.createElement('div', { 
                    className: 'aurora-circle bg-indigo-500',
                    style: { 
                        width: '60vw', 
                        height: '60vw', 
                        top: '-20%', 
                        left: '-10%',
                        animationDelay: '0s'
                    }
                }),
                React.createElement('div', { 
                    className: 'aurora-circle bg-purple-600',
                    style: { 
                        width: '50vw', 
                        height: '50vw', 
                        top: '40%', 
                        right: '-15%',
                        animationDelay: '7s'
                    }
                }),
                React.createElement('div', { 
                    className: 'aurora-circle bg-cyan-500',
                    style: { 
                        width: '45vw', 
                        height: '45vw', 
                        bottom: '-10%', 
                        left: '20%',
                        animationDelay: '14s'
                    }
                })
            );
        };
        
        // Film Grain Overlay Component
        const FilmGrainOverlay = () => {
            return React.createElement('div', { className: 'film-grain' });
        };
        
        // 3D Tilt Card Component
        const TiltCard = ({ children, className = "", intensity = 10, onClick }) => {
            const cardRef = useRef(null);
            
            const handleMouseMove = (e) => {
                if (cardRef.current) {
                    const rect = cardRef.current.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    
                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;
                    
                    const rotateY = ((x - centerX) / centerX) * intensity;
                    const rotateX = ((centerY - y) / centerY) * intensity;
                    
                    cardRef.current.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
                }
            };
            
            const handleMouseLeave = () => {
                if (cardRef.current) {
                    cardRef.current.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)';
                }
            };
            
            return React.createElement('div', {
                ref: cardRef,
                className: `tilt-card ${className}`,
                onMouseMove: handleMouseMove,
                onMouseLeave: handleMouseLeave,
                onClick: onClick,
                role: onClick ? "button" : undefined,
                tabIndex: onClick ? 0 : undefined,
                onKeyDown: onClick ? (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        onClick();
                    }
                } : undefined
            }, children);
        };
        
        // Cinematic Text Reveal Component
        const CinematicText = ({ text, className = "", delay = 0, stagger = 0.1, typewriter = false }) => {
            const [isVisible, setIsVisible] = useState(false);
            const ref = useRef(null);
            
            useEffect(() => {
                const observer = new IntersectionObserver(
                    ([entry]) => {
                        if (entry.isIntersecting) {
                            setIsVisible(true);
                        }
                    },
                    { threshold: 0.1 }
                );
                
                if (ref.current) {
                    observer.observe(ref.current);
                }
                
                return () => {
                    if (ref.current) {
                        observer.unobserve(ref.current);
                    }
                };
            }, []);
            
            if (typewriter) {
                return React.createElement('div', {
                    ref,
                    className: `${className} ${isVisible ? 'typewriter' : 'opacity-0'}`,
                    style: { animationDelay: `${delay}s` }
                }, text);
            }
            
            const words = text.split(' ');
            
            return React.createElement('div', {
                ref,
                className: className
            }, 
                words.map((word, index) => 
                    React.createElement('span', {
                        key: index,
                        className: 'text-reveal-container mr-2',
                        style: { 
                            animationDelay: isVisible ? `${delay + (index * stagger)}s` : '0s'
                        }
                    },
                        React.createElement('span', {
                            className: 'text-reveal-word'
                        }, word + (index < words.length - 1 ? ' ' : ''))
                    )
                )
            );
        };
        
        // Parallax Component
        const ParallaxElement = ({ children, speed = 0.5, className = "" }) => {
            const [scrollY, setScrollY] = useState(0);
            const ref = useRef(null);
            
            useEffect(() => {
                const handleScroll = () => {
                    if (ref.current) {
                        const rect = ref.current.getBoundingClientRect();
                        const elementTop = rect.top + window.scrollY;
                        const elementScrollProgress = (window.scrollY - elementTop + window.innerHeight) / (window.innerHeight + rect.height);
                        
                        setScrollY(elementScrollProgress * speed * 100);
                    }
                };
                
                window.addEventListener('scroll', handleScroll);
                handleScroll(); // Initial calculation
                
                return () => window.removeEventListener('scroll', handleScroll);
            }, [speed]);
            
            return React.createElement('div', {
                ref,
                className: `parallax-element ${className}`,
                style: { transform: `translateY(${scrollY}px)` }
            }, children);
        };
        
        // Custom animation hooks
        const useScrollAnimation = () => {
            const [isVisible, setIsVisible] = useState(false);
            const ref = useRef(null);
            
            useEffect(() => {
                const observer = new IntersectionObserver(
                    ([entry]) => {
                        if (entry.isIntersecting) {
                            setIsVisible(true);
                        }
                    },
                    { threshold: 0.1 }
                );
                
                if (ref.current) {
                    observer.observe(ref.current);
                }
                
                return () => {
                    if (ref.current) {
                        observer.unobserve(ref.current);
                    }
                };
            }, []);
            
            return [ref, isVisible];
        };
        
        // Animation Components
        const FadeInUp = ({ children, delay = 0, className = "" }) => {
            const [ref, isVisible] = useScrollAnimation();
            
            return React.createElement('div', {
                ref,
                className: `${className} ${isVisible ? 'fade-in-up' : 'opacity-0'}`,
                style: { animationDelay: `${delay}s` }
            }, children);
        };
        
        const SlideInLeft = ({ children, delay = 0, className = "" }) => {
            const [ref, isVisible] = useScrollAnimation();
            
            return React.createElement('div', {
                ref,
                className: `${className} ${isVisible ? 'slide-in-left' : 'opacity-0'}`,
                style: { animationDelay: `${delay}s` }
            }, children);
        };
        
        const ScaleIn = ({ children, delay = 0, className = "" }) => {
            const [ref, isVisible] = useScrollAnimation();
            
            return React.createElement('div', {
                ref,
                className: `${className} ${isVisible ? 'scale-in' : 'opacity-0'}`,
                style: { animationDelay: `${delay}s` }
            }, children);
        };
        
        const StaggerContainer = ({ children, className = "", staggerDelay = 0.1 }) => {
            const [ref, isVisible] = useScrollAnimation();
            
            return React.createElement('div', {
                ref,
                className: className
            }, 
                React.Children.map(children, (child, index) => 
                    React.cloneElement(child, {
                        style: { 
                            animationDelay: isVisible ? `${index * staggerDelay}s` : '0s'
                        }
                    })
                )
            );
        };
        
        // Spotlight Card Component
        const SpotlightCard = ({ children, className = "" }) => {
            const cardRef = useRef(null);
            
            const handleMouseMove = (e) => {
                if (cardRef.current) {
                    const rect = cardRef.current.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    
                    cardRef.current.style.setProperty('--x', `${x}px`);
                    cardRef.current.style.setProperty('--y', `${y}px`);
                }
            };
            
            return React.createElement('div', {
                ref: cardRef,
                className: `spotlight ${className}`,
                onMouseMove: handleMouseMove
            }, children);
        };
        
        // Simple icon component
        const Icon = ({ name, className = "" }) => {
            const icons = {
                menu: React.createElement('svg', { width: '24', height: '24', viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', className: className },
                    React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: 2, d: 'M4 6h16M4 12h16M4 18h16' })
                ),
                x: React.createElement('svg', { width: '24', height: '24', viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', className: className },
                    React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: 2, d: 'M6 18L18 6M6 6l12 12' })
                ),
                check: "✓",
                layout: "⧉",
                zap: "⚡",
                shield: "🛡️",
                mail: "✉️",
                message: "💬",
                map: "📍",
                user: "👤",
                lock: "🔒",
                eye: "👁️",
                eyeOff: "🙈",
                arrowRight: "→",
                creditCard: "💳",
                calendar: "📅",
                projects: "📊",
                team: "👥",
                settings: "⚙️",
                bell: "🔔",
                search: "🔍",
                grid: "🔲",
                list: "📋",
                plus: "➕",
                database: "🗄️",
                chart: "📈",
                analytics: "🔍",
                security: "🔐",
                collaboration: "🤝",
                scale: "⚖️",
                download: "📥",
                upload: "📤",
                trash: "🗑️",
                edit: "✏️",
                share: "↗️"
            };
            return icons[name] || React.createElement('span', { 
                className: `inline-block ${className}` 
            }, "•");
        };

        // Footer Component
        const Footer = ({ setCurrentView }) => {
            return React.createElement('footer', { 
                className: 'glass border-t border-slate-800 py-8 px-6 md:px-12 mt-20' 
            },
                React.createElement('div', { className: 'max-w-6xl mx-auto' },
                    React.createElement('div', { className: 'flex flex-col md:flex-row justify-between items-center' },
                        React.createElement('div', { className: 'flex items-center space-x-2 mb-4 md:mb-0' },
                            React.createElement('div', { 
                                className: 'w-6 h-6 rounded-full brand-gradient'
                            }),
                            React.createElement('span', { className: 'text-lg font-bold' }, 'Nexus Analytics')
                        ),
                        
                        React.createElement('div', { className: 'flex flex-wrap justify-center space-x-6' },
                            React.createElement('button', {
                                className: 'text-slate-400 hover:text-white transition-colors',
                                onClick: () => setCurrentView('terms')
                            }, 'Terms of Service'),
                            React.createElement('button', {
                                className: 'text-slate-400 hover:text-white transition-colors',
                                onClick: () => setCurrentView('privacy')
                            }, 'Privacy Policy'),
                            React.createElement('button', {
                                className: 'text-slate-400 hover:text-white transition-colors',
                                onClick: () => setCurrentView('contact')
                            }, 'Contact'),
                            React.createElement('button', {
                                className: 'text-slate-400 hover:text-white transition-colors',
                                onClick: () => setCurrentView('support')
                            }, 'Support')
                        ),
                        
                        React.createElement('div', { className: 'mt-4 md:mt-0 text-slate-400 text-sm' },
                            '© 2024 Nexus Analytics. All rights reserved.'
                        )
                    )
                )
            );
        };

        // NEW PAGES START HERE

        // Profile View Component
        const ProfileView = ({ setCurrentView }) => {
            const [activeTab, setActiveTab] = useState('personal');
            
            return React.createElement('div', { className: 'min-h-screen bg-slate-950 py-8 px-6' },
                React.createElement('div', { className: 'max-w-6xl mx-auto' },
                    React.createElement('div', { className: 'flex justify-between items-center mb-8' },
                        React.createElement('h1', { className: 'text-3xl font-bold' }, 'Profile Settings'),
                        React.createElement('button', {
                            onClick: () => setCurrentView('dashboard'),
                            className: 'px-4 py-2 glass text-slate-300 rounded-lg hover:text-white transition-colors'
                        }, '← Back to Dashboard')
                    ),
                    
                    React.createElement('div', { className: 'grid grid-cols-1 lg:grid-cols-4 gap-8' },
                        // Profile sidebar
                        React.createElement('div', { className: 'lg:col-span-1' },

                                        React.createElement('div', { className: 'mb-6' },
                                            plan.name === 'Starter' 
                                                ? React.createElement('span', { className: 'text-4xl font-bold brand-gradient-text' }, 'Free')
                                                : React.createElement(React.Fragment, null,
                                                    React.createElement('span', { className: 'text-4xl font-bold' }, 
                                                        '$', isAnnual ? plan.annualPrice : plan.monthlyPrice
                                                    ),
                                                    React.createElement('span', { className: 'text-slate-400 ml-2' }, '/month')
                                                  )
                                        ),
                                        React.createElement('ul', { className: 'space-y-4 mb-8 flex-grow' },
                                            plan.features.map((feature, i) => 
                                                React.createElement('li', { key: i, className: 'flex items-start' },
                                                    React.createElement(Icon, { name: 'check', className: 'w-5 h-5 text-cyan-400 mr-3 mt-0.5 flex-shrink-0' }),
                                                    React.createElement('span', { className: 'text-slate-300' }, feature)
                                                )
                                            )
                                        ),
                                        React.createElement(TiltCard, { intensity: 8 },
                                            React.createElement('button', {
                                                onClick: () => handlePlanSelection(plan),
                                                className: `w-full py-3 rounded-lg font-medium transition-all duration-300 hover:scale-105 ${
                                                    plan.popular
                                                        ? 'brand-gradient text-white hover:opacity-90'
                                                        : plan.name === 'Starter'
                                                        ? 'brand-gradient text-white hover:opacity-90'
                                                        : 'glass text-slate-300 hover:text-white border border-slate-700'
                                                }`
                                            }, plan.cta)
                                        )
                                    )
                                )
                            )
                        )
                    )
                )
            );
        }
        
        // Contact View Component - UPDATED with validation and toast
        function ContactView({ pushToast }) {
            const [formData, setFormData] = useState({
                name: '',
                email: '',
                company: '',
                message: ''
            });
            const [errors, setErrors] = useState({});
            
            const handleChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({
                    ...prev,
                    [name]: value
                }));
                
                // Clear error when user starts typing
                if (errors[name]) {
                    setErrors(prev => ({
                        ...prev,
                        [name]: ''
                    }));
                }
            };
            
            const validateForm = () => {
                const newErrors = {};
                
                if (!formData.name.trim()) {
                    newErrors.name = 'Name is required';
                }
                
                if (!formData.email.trim()) {
                    newErrors.email = 'Email is required';
                } else if (!/\S+@\S+\.\S+/.test(formData.email)) {
                    newErrors.email = 'Email is invalid';
                }
                
                if (!formData.message.trim()) {
                    newErrors.message = 'Message is required';
                }
                
                setErrors(newErrors);
                return Object.keys(newErrors).length === 0;
            };
            
            const handleSubmit = (e) => {
                e.preventDefault();
                
                if (!validateForm()) {
                    return;
                }
                
                pushToast('Thank you for your message! Our data experts will get back to you soon.', 'success');
                setFormData({
                    name: '',
                    email: '',
                    company: '',
                    message: ''
                });
            };
            
            return React.createElement('div', { className: 'py-20 px-6 md:px-12' },
                React.createElement('div', { className: 'max-w-4xl mx-auto' },
                    React.createElement('div', { className: 'text-center mb-16' },
                        React.createElement(FadeInUp, { delay: 0.5 },
                            React.createElement(CinematicText, { 
                                text: 'Let\'s Talk About Your Data',
                                className: 'text-4xl md:text-5xl font-bold mb-4',
                                delay: 0.2,
                                stagger: 0.05
                            })
                        ),
                        React.createElement(FadeInUp, { delay: 0.7 },
                            React.createElement('p', { 
                                className: 'text-xl text-slate-300 max-w-2xl mx-auto' 
                            }, 'We help teams unlock deeper insights from their data. Get in touch to see how Nexus Analytics can transform your workflow.')
                        )
                    ),
                    
                    React.createElement('div', { className: 'flex flex-col md:flex-row gap-12' },
                        // Contact Info
                        React.createElement(FadeInUp, { delay: 0.9, className: 'md:w-1/3' },
                            React.createElement(TiltCard, { intensity: 8 },
                                React.createElement(SpotlightCard, { className: 'glass rounded-2xl p-8 h-fit transition-all duration-300 hover:scale-102' },
                                    React.createElement('h2', { className: 'text-2xl font-bold mb-6' }, 'Contact information'),
                                    React.createElement('div', { className: 'space-y-6' },
                                        React.createElement('div', { className: 'flex items-start' },
                                            React.createElement(Icon, { name: 'mail', className: 'w-5 h-5 text-cyan-400 mr-4 mt-1 flex-shrink-0' }),
                                            React.createElement('div', null,
                                                React.createElement('p', { className: 'font-medium' }, 'Email us'),
                                                React.createElement('p', { className: 'text-slate-300' }, 'hello@nexusanalytics.com')
                                            )
                                        ),
                                        React.createElement('div', { className: 'flex items-start' },
                                            React.createElement(Icon, { name: 'message', className: 'w-5 h-5 text-cyan-400 mr-4 mt-1 flex-shrink-0' }),
                                            React.createElement('div', null,
                                                React.createElement('p', { className: 'font-medium' }, 'Chat with us'),
                                                React.createElement('p', { className: 'text-slate-300' }, 'Start a conversation')
                                            )
                                        ),
                                        React.createElement('div', { className: 'flex items-start' },
                                            React.createElement(Icon, { name: 'map', className: 'w-5 h-5 text-cyan-400 mr-4 mt-1 flex-shrink-0' }),
                                            React.createElement('div', null,
                                                React.createElement('p', { className: 'font-medium' }, 'Visit us'),
                                                React.createElement('p', { className: 'text-slate-300' }, 'San Francisco, CA')
                                            )
                                        )
                                    )
                                )
                            )
                        ),
                        
                        // Contact Form
                        React.createElement(FadeInUp, { delay: 1.1, className: 'md:w-2/3' },
                            React.createElement(TiltCard, { intensity: 10 },
                                React.createElement(SpotlightCard, { className: 'glass rounded-2xl p-8 transition-all duration-300 hover:scale-102' },
                                    React.createElement('form', { 
                                        onSubmit: handleSubmit
                                    },
                                        React.createElement('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-6 mb-6' },
                                            React.createElement('div', null,
                                                React.createElement('label', { 
                                                    htmlFor: 'name',
                                                    className: 'block text-sm font-medium text-slate-300 mb-2' 
                                                }, 'Full name'),
                                                React.createElement('input', {
                                                    type: 'text',
                                                    id: 'name',
                                                    name: 'name',
                                                    value: formData.name,
                                                    onChange: handleChange,
                                                    required: true,
                                                    className: `w-full px-4 py-3 bg-slate-800 border rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition-all duration-300 focus:scale-102 ${
                                                        errors.name ? 'border-red-500' : 'border-slate-700'
                                                    }`
                                                }),
                                                errors.name && React.createElement('p', { className: 'text-red-400 text-sm mt-1' }, errors.name)
                                            ),
                                            React.createElement('div', null,
                                                React.createElement('label', { 
                                                    htmlFor: 'email',
                                                    className: 'block text-sm font-medium text-slate-300 mb-2' 
                                                }, 'Email address'),
                                                React.createElement('input', {
                                                    type: 'email',
                                                    id: 'email',
                                                    name: 'email',
                                                    value: formData.email,
                                                    onChange: handleChange,
                                                    required: true,
                                                    className: `w-full px-4 py-3 bg-slate-800 border rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition-all duration-300 focus:scale-102 ${
                                                        errors.email ? 'border-red-500' : 'border-slate-700'
                                                    }`
                                                }),
                                                errors.email && React.createElement('p', { className: 'text-red-400 text-sm mt-1' }, errors.email)
                                            )
                                        ),
                                        React.createElement('div', { className: 'mb-6' },
                                            React.createElement('label', { 
                                                htmlFor: 'company',
                                                className: 'block text-sm font-medium text-slate-300 mb-2' 
                                            }, 'Company'),
                                            React.createElement('input', {
                                                type: 'text',
                                                id: 'company',
                                                name: 'company',
                                                value: formData.company,
                                                onChange: handleChange,
                                                className: 'w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition-all duration-300 focus:scale-102'
                                            })
                                        ),
                                        React.createElement('div', { className: 'mb-6' },
                                            React.createElement('label', { 
                                                htmlFor: 'message',
                                                className: 'block text-sm font-medium text-slate-300 mb-2' 
                                            }, 'Message'),
                                            React.createElement('textarea', {
                                                id: 'message',
                                                name: 'message',
                                                value: formData.message,
                                                onChange: handleChange,
                                                required: true,
                                                rows: 5,
                                                className: `w-full px-4 py-3 bg-slate-800 border rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition-all duration-300 focus:scale-102 ${
                                                    errors.message ? 'border-red-500' : 'border-slate-700'
                                                }`
                                            }),
                                            errors.message && React.createElement('p', { className: 'text-red-400 text-sm mt-1' }, errors.message)
                                        ),
                                        React.createElement(TiltCard, { intensity: 8 },
                                            React.createElement('button', {
                                                type: 'submit',
                                                className: 'w-full px-6 py-3 brand-gradient text-white rounded-lg font-medium hover:opacity-90 transition-all duration-300 hover:scale-105'
                                            }, 'Send message')
                                        )
                                    )
                                )
                            )
                        )
                    )
                )
            );
        }
        
        // Render the app
        ReactDOM.render(React.createElement(App), document.getElementById('root'));
    </script>
</body>
</html>
