name: CI/CD - build and push images

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      # Create .env file with secrets for build
      - name: Create env file
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}" >> .env
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
          echo "PORT=5000" >> .env
          echo "NODE_ENV=production" >> .env
          
      - name: Build and push web image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile.web
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/nexus-web:latest
          no-cache: true
          
      - name: Build and push api image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile.api
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/nexus-api:latest
          no-cache: true
