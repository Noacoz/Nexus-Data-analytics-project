name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Debug secrets availability
        run: |
          echo "Checking if secrets are available..."
          if [ -n "$SUPABASE_URL" ]; then echo "SUPABASE_URL: ✓ available"; else echo "SUPABASE_URL: ✗ MISSING"; fi
          if [ -n "$SUPABASE_SERVICE_KEY" ]; then echo "SUPABASE_SERVICE_KEY: ✓ available"; else echo "SUPABASE_SERVICE_KEY: ✗ MISSING"; fi
          if [ -n "$GROQ_API_KEY" ]; then echo "GROQ_API_KEY: ✓ available"; else echo "GROQ_API_KEY: ✗ MISSING"; fi
          if [ -n "$JWT_SECRET" ]; then echo "JWT_SECRET: ✓ available"; else echo "JWT_SECRET: ✗ MISSING"; fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
      
      - name: Install dependencies
        run: npm ci
      
      - name: Create .env file
        run: |
          echo "Creating .env file..."
          echo "SUPABASE_URL=$SUPABASE_URL" > .env
          echo "SUPABASE_SERVICE_KEY=$SUPABASE_SERVICE_KEY" >> .env
          echo "GROQ_API_KEY=$GROQ_API_KEY" >> .env
          echo "JWT_SECRET=$JWT_SECRET" >> .env
          echo "PORT=5000" >> .env
          echo "NODE_ENV=test" >> .env
          echo ".env file created"
          wc -l .env
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
      
      - name: Build
        run: node build-vite.js
        env:
          NODE_ENV: production
      
      - name: Run smoke tests
        run: node scripts/ci_smoke.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          PORT: 5000
          NODE_ENV: test
