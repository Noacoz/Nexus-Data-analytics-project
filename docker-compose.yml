version: '3.8'
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "4000:4000"
    environment:
      - API_KEY=${API_KEY:-}
    env_file:
      - .env
    volumes:
      - ./data:/data

  analytics:
    build:
      context: .
      dockerfile: Dockerfile.analytics
    ports:
      - "8001:8001"
    env_file:
      - .env
    volumes:
      - ./data:/data
    depends_on:
      - api

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "5000:5000"
    depends_on:
      - api
      - analytics
    environment:
      - API_KEY=${API_KEY:-}
    env_file:
      - .env

