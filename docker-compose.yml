version: '3.8'
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "4000:4000"
    environment:
      - API_KEY=${API_KEY:-}
    volumes:
      - ./data:/data

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "5000:5000"
    depends_on:
      - api
    environment:
      - API_KEY=${API_KEY:-}
