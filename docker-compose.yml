services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nexus
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "4000:4000"
    environment:
      - API_KEY=${API_KEY:-}
    env_file:
      - .env
    volumes:
      - ./data:/data
    depends_on:
      - db

  analytics:
    build:
      context: .
      dockerfile: Dockerfile.analytics
    ports:
      - "8001:8001"
    env_file:
      - .env
    volumes:
      - ./data:/data
    depends_on:
      - api
      - db

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "5000:5000"
    depends_on:
      - api
      - analytics
      - db
    environment:
      - API_KEY=${API_KEY:-}
    env_file:
      - .env

volumes:
  db_data:

